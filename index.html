<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Silbenflug – Entwicklung</title>
<style>
:root{--bg:#d6e8fb;--card:#fff;--ink:#1f2a44;--sub:#4b5b7a;--line:#b9d3f2;--c1:#2f7fd8;--c2:#2faa5a;--c3:#f08a24;--c4:#7b5fd6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141c2e;--card:#1e2942;--ink:#eef3ff;--sub:#9db0d0;--line:#34456b}}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:22px 16px 32px}
h1{margin:0 0 16px}
h1 img{display:block;width:100%;height:auto;background:#fff;border-radius:20px;border:3px solid var(--line)}
p.sub{margin:0 0 20px;color:var(--sub)}
.grid{display:grid;gap:14px}
a.tile{display:block;background:var(--card);border:3px solid var(--line);border-left:12px solid var(--c);border-radius:20px;padding:16px 18px;color:inherit;text-decoration:none}
a.tile:active{transform:translateY(2px)}
a.tile b{display:block;font-size:1.3rem}
a.tile span{display:block;color:var(--sub);font-size:.95rem;margin-top:2px}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row a{flex:1;min-width:140px;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px;color:inherit;text-decoration:none;font-size:.95rem}
#st{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--card);border:3px solid var(--line);font-size:.95rem}
.ok{border-color:#2faa5a!important}.bad{border-color:#e8505b!important}
label{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--sub);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1><img src="lautolino-logo.jpg" alt="Lautolino" width="1024" height="254"></h1>
<p class="sub">Silbenflug – Entwicklung. Schnell zwischen den drei Oberflächen wechseln.</p>
<div class="grid">
  <a class="tile" style="--c:var(--c1)" href="https://stolenmonkey.github.io/Lautolino/apps/web/" data-t><b>Verwaltung</b><span>Admin, Schulleitung, Lehrkräfte</span></a>
  <a class="tile" style="--c:var(--c2)" href="https://stolenmonkey.github.io/Lautolino/apps/kids/" data-t><b>Kinder-App</b><span>Anmeldung mit Merkschlüssel, Silbenrunden</span></a>
  <a class="tile" style="--c:var(--c3)" href="https://stolenmonkey.github.io/Lautolino/apps/eltern/" data-t><b>Elternseite</b><span>Anmeldung mit Elterncode, Fortschritt</span></a>
</div>
<label><input type="checkbox" id="nt" checked> Links in neuem Tab öffnen</label>
<div class="row">
  <a href="https://lautolino-api.lautolino.workers.dev/health" target="_blank" rel="noopener">Server: /health</a>
  <a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare</a>
  <a href="https://github.com/stolenmonkey/Lautolino" target="_blank" rel="noopener">GitHub</a>
</div>
<div id="st">Serverstatus wird geprüft …</div>
</main>
<script>
(function(){
  var nt=document.getElementById("nt"),tiles=document.querySelectorAll("[data-t]");
  try{var v=localStorage.getItem("sf-nt");if(v!==null)nt.checked=v==="1";}catch(e){}
  function apply(){tiles.forEach(function(a){if(nt.checked){a.target="_blank";a.rel="noopener";}else{a.removeAttribute("target");}});try{localStorage.setItem("sf-nt",nt.checked?"1":"0");}catch(e){}}
  nt.addEventListener("change",apply);apply();
  var st=document.getElementById("st");
  fetch("https://lautolino-api.lautolino.workers.dev/health").then(function(r){
    st.textContent=r.ok?"Server erreichbar (HTTP "+r.status+").":"Server antwortet mit HTTP "+r.status+".";
    st.className=r.ok?"ok":"bad";
  }).catch(function(){st.textContent="Server nicht erreichbar oder von dieser Adresse aus blockiert.";st.className="bad";});
})();
</script>
</body>
</html>
