# Silbenflug-Server (Cloudflare Worker + D1). Die mit <...> markierten Werte trägst du nach dem Anlegen des Accounts ein.
name = "lautolino-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "lautolino_db"
database_id = "7381d8ff-0128-4b65-99fa-bdacdf0c0936"
migrations_dir = "../../db/migrations"

[vars]
ALLOWED_ORIGINS = "https://stolenmonkey.github.io"   # später: Adresse der Oberfläche, z. B. https://silbenflug.pages.dev
APP_URL = "https://stolenmonkey.github.io/Lautolino/apps/web/"
MAIL_FROM = "Lautolino <lautolino@gmx.de>"
# Geheimnis (nicht in diese Datei schreiben):  npx wrangler secret put PEPPER   (mindestens 32 zufällige Zeichen)
